name: Bounded feed access diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx src/diagnose-feed.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-diagnosis
          path: .cache/feed-diagnosis/report.json
          include-hidden-files: true
          retention-days: 14
