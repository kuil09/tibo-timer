name: Update and publish Tibo Timer
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: Collect the latest page and interpret changed posts
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tibo-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Configure state persistence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect and interpret latest posts
        id: sync
        if: github.event_name != 'workflow_dispatch' || inputs.collect
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERSIST_STATE: 'true'
        run: npm run sync
      - name: Build public snapshot
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify deployed files
        run: node src/verify.mjs
      - name: Report upstream or model failure
        if: steps.sync.outcome == 'failure'
        run: |
          echo '::error::Published the safe status snapshot, but source or model processing needs attention.'
          exit 1
