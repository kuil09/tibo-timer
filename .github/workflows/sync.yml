name: Publish Pages (optional collection)
on:
  workflow_dispatch:
    inputs:
      collect:
        description: Explicitly fetch upstream once (leave off for local data publication)
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['docs/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: collect-and-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Fetch and identify changed posts
        id: plan
        if: inputs.collect == true
        continue-on-error: true
        run: node --import tsx src/sync.ts plan
      - uses: actions/cache@v4
        if: steps.plan.outputs.inference == 'true'
        with:
          path: |
            .cache/cpu/*.gguf
            .cache/cpu/runtime.tar.gz
          key: cpu-v2-${{ runner.os }}-${{ steps.plan.outputs.model }}-${{ hashFiles('config/models.lock.json') }}
      - name: Prepare and start approved CPU model
        id: cpu
        timeout-minutes: 4
        if: steps.plan.outputs.inference == 'true'
        continue-on-error: true
        run: |
          python3 scripts/prepare-cpu.py '${{ steps.plan.outputs.model }}'
          export MODEL_PATH=$(python3 -c "import json;print(json.load(open('.cache/cpu/prepared.json'))['model_path'])")
          export LLAMA_SERVER=$(python3 -c "import json;print(json.load(open('.cache/cpu/prepared.json'))['server_path'])")
          bash scripts/start-cpu.sh
      - name: Normalize and persist
        if: steps.plan.outcome == 'success'
        env:
          SYNC_BUDGET_MS: '240000'
          CPU_READY: ${{ steps.cpu.outcome }}
        run: node --import tsx src/sync.ts apply
      - name: Save collection state
        if: inputs.collect == true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve reset feed and sync state'
            git push origin HEAD:main
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report-${{ github.run_id }}
          path: .cache/sync-report.json
          include-hidden-files: true
          retention-days: 3
      - name: Report stale upstream
        if: steps.plan.outcome == 'failure'
        run: |
          echo 'The last valid dataset was deployed; upstream refresh failed.'
          exit 1
