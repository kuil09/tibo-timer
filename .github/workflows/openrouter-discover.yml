name: Discover free OpenRouter models
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openrouter-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Discover currently free model candidates
        run: node --import tsx src/openrouter.ts discover
      - name: Preserve catalog for the council
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-catalog
          path: .cache/openrouter/catalog.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
