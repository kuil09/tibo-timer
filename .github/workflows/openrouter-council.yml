name: OpenRouter independent inference and cross-review
on:
  workflow_run:
    workflows: ['Discover free OpenRouter models']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      max_posts:
        description: Maximum stored posts to review (1-5; at most nine requests per post)
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '5'
permissions:
  contents: read
  actions: read
concurrency:
  group: openrouter-council
  cancel-in-progress: false
jobs:
  council:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # workflow_run executes trusted default-branch code, not code from the artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Require inference credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Set the OPENROUTER_API_KEY repository secret before running inference.'
            exit 1
          fi
      - name: Download the triggering discovery catalog
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: openrouter-catalog
          path: .cache/openrouter
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Discover a fresh catalog for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: node --import tsx src/openrouter.ts discover
      - name: Infer independently and review anonymously
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MAX_POSTS: ${{ inputs.max_posts || '5' }}
        run: node --import tsx src/openrouter.ts council
      - name: Preserve results and partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-council
          path: .cache/openrouter/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
