name: Automatic AI checks
on:
  push:
    branches: ['feat/latest-automatic-ai']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Plan latest-only monitoring
        id: plan
        if: github.event_name == 'push'
        run: node --import tsx src/sync.ts plan
      - uses: actions/cache@v4
        if: steps.plan.outputs.inference == 'true'
        with:
          path: |
            .cache/cpu/*.gguf
            .cache/cpu/runtime.tar.gz
          key: cpu-v2-${{ runner.os }}-${{ steps.plan.outputs.model }}-${{ hashFiles('config/models.lock.json') }}
      - name: Start CPU model without paid APIs
        if: steps.plan.outputs.inference == 'true'
        run: |
          python3 scripts/prepare-cpu.py '${{ steps.plan.outputs.model }}'
          export MODEL_PATH=$(python3 -c "import json;print(json.load(open('.cache/cpu/prepared.json'))['model_path'])")
          export LLAMA_SERVER=$(python3 -c "import json;print(json.load(open('.cache/cpu/prepared.json'))['server_path'])")
          bash scripts/start-cpu.sh
      - name: Reject obvious semantic misclassification
        if: steps.plan.outputs.inference == 'true'
        run: node --import tsx scripts/smoke-auto-ai.ts
      - name: Interpret real latest posts without publishing
        if: github.event_name == 'push'
        env:
          SYNC_BUDGET_MS: '240000'
        run: |
          node --import tsx src/sync.ts apply
          npm run build
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.cache/sync-report.json','utf8')); console.log(JSON.stringify(r)); if(r.analysis.failed) process.exit(1);"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: automatic-ai-evidence-${{ github.run_attempt }}
          path: |
            .cache/sync-report.json
            .cache/automatic-ai-smoke.json
            .cache/inference-trace.jsonl
            .cache/evaluation/server.log
            dist/events.json
          include-hidden-files: true
          retention-days: 3
