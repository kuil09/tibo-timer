<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tibo의 최신 리셋 공지를 확인하고 내 시간대의 예정 시각을 봅니다.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Tibo Timer — 리셋 예정 시각</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./">TIBO</a>
      <a class="profile-link" href="https://x.com/thsottiaux" rel="noopener noreferrer" target="_blank">Tibo 원문 ↗</a>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">최근 리셋 공지</p>
      <h1 id="hero-title">확인 중</h1>
      <p class="time" id="reset-time"></p>
      <p id="countdown" class="countdown"></p>
      <p class="hero-note">실제 계정 상태와 다를 수 있습니다.</p>
      <a id="hero-source" hidden target="_blank" rel="noopener noreferrer">근거 발언 보기 ↗</a>
    </section>

    <section class="portrait" aria-hidden="true">
      <div class="portrait-stage">
        <canvas id="tibo-ascii-canvas"></canvas>
        <pre id="tibo-ascii-fallback" hidden></pre>
      </div>
    </section>

    <section class="posts" aria-labelledby="posts-title">
      <div class="section-heading">
        <h2 id="posts-title">최근 발언</h2>
      </div>
      <div id="posts"></div>
    </section>
  </main>
</body>
</html>
